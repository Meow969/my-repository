name: Update and Publish AI Shopping Radar

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 3 * * *' # 11:00 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - run: python scripts/update_content.py --days 30 --limit 8
      - name: Commit data updates
        run: |
          if [[ -n "$(git status --porcelain data)" ]]; then
            git config user.name "ai-shopping-radar-bot"
            git config user.email "ai-shopping-radar-bot@users.noreply.github.com"
            git add data
            git commit -m "Update AI shopping radar data"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && break
              if [[ "$attempt" == "3" ]]; then
                echo "Failed to push data updates after 3 attempts"
                exit 1
              fi
              sleep 5
            done
          else
            echo "No data changes"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
