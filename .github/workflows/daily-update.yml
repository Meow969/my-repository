name: Update and Publish AI Shopping Radar

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '0 3 * * *' # 11:00 Asia/Shanghai; GitHub may delay scheduled runs.
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: python -m pip install -r scripts/requirements.txt
      - name: Test parsing, evidence and relevance rules
        run: |
          python -m unittest discover -s tests -v
          node --check app.js
      - name: Discover, verify and refresh research
        if: github.event_name != 'push'
        run: python scripts/evidence_pipeline.py --days 45 --limit 24 --max-google-queries 32
        timeout-minutes: 16
      - name: Validate publication data
        run: python scripts/validate_data.py
      - name: Commit verified data updates
        if: github.event_name != 'push'
        run: |
          if [[ -n "$(git status --porcelain data)" ]]; then
            git config user.name "ai-shopping-radar-bot"
            git config user.email "ai-shopping-radar-bot@users.noreply.github.com"
            git add data
            git commit -m "Update evidence-based AI shopping radar"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Stage public files only
        run: |
          mkdir -p public/data
          cp index.html app.js styles.css .nojekyll public/
          cp data/*.json public/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Run summary
        if: always()
        run: |
          echo 'Daily radar: refreshed monthly summaries, recommendations and daily timeline. Source diagnostics remain in data/source_health.json.' >> "$GITHUB_STEP_SUMMARY"
          echo 'If this run failed, the previous Pages deployment remains available. Check failed steps before retrying.' >> "$GITHUB_STEP_SUMMARY"
