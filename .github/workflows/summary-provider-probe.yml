name: Verify Chinese Summary Provider
on:
  workflow_dispatch:
permissions:
  contents: read
  models: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Test public excerpt translation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request
          body={'model':'openai/gpt-4.1-mini','messages':[{'role':'user','content':'Translate into concise Chinese, preserve brand names: Newegg, a specialist in computer and technology products, has unveiled a conversational AI shopping experience that lets people move from idea to cart in one place.'}],'max_tokens':150}
          req=urllib.request.Request('https://models.github.ai/inference/chat/completions',data=json.dumps(body).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=60) as r:
              data=json.load(r)
              print(data['choices'][0]['message']['content'])
          PY
