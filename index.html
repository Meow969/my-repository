<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta name="description" content="Meow的AI购物研究雷达：多源追踪，原文核验，事实与产品假设分开阅读。每日自动更新。" />
  <title>Meow的AI购物雷达响了</title>
  <link rel="stylesheet" href="./styles.css?v=2026-10-08-tech-timeline-v2" />
</head>
<body>
  <header class="hero compact-hero">
    <nav class="nav">
      <div class="brand">Meow的AI购物雷达响了</div>
    </nav>
    <div class="nav-links tab-switcher primary-tabs" role="tablist" aria-label="主导航">
      <button class="top-tab active" data-tab="feed" role="tab">有事没事来看看<span class="update-dot" data-dot="feed" aria-label="有更新"></span></button>
      <button class="top-tab" data-tab="inspiration" role="tab">回声<span class="update-dot" data-dot="inspiration" aria-label="有更新"></span></button>
    </div>
    <section class="toolbar global-toolbar" aria-label="全局搜索和筛选工具">
      <input id="searchInput" type="search" aria-label="搜索全部资讯和回声" placeholder="搜索资讯和回声：记忆 / 信任 / 闭环…" />
      <select id="regionFilter" aria-label="地区筛选"><option value="all">地区</option></select>
      <select id="typeFilter" aria-label="分类筛选"><option value="all">分类</option></select>
      <select id="categoryFilter" aria-label="主题筛选"><option value="all">主题</option></select>
      <div id="globalStats" class="global-stats"></div>
    </section>
  </header>

  <main>
    <section id="feedTab" class="tab-panel active">
      <section id="daily" class="section">
        <div class="section-title">
          <h2>有事没事来看看</h2>
          <span id="updateStatus" class="update-status" role="status"></span>
        </div>
        <div id="monthTabs" class="month-tabs"></div>
        <div id="activeMonthlyReport" class="active-monthly-report"></div>
        <div class="feed-controls"><span id="filterContext" aria-live="polite"></span><button id="savedFilter" aria-pressed="false">☆ 收藏</button><details class="filter-menu"><summary>筛选</summary><div><select id="qualityFilter" aria-label="证据分级"><option value="all">全部资讯</option><option value="精选">原文精选</option><option value="观察">观察线索</option></select><button id="clearFilters">清除筛选</button></div></details></div>
        <div id="articleGroups" class="article-groups"></div>
      </section>
    </section>

    <section id="inspirationTab" class="tab-panel">
      <section id="insights" class="section section-soft">
        <div class="section-title">
          <p class="eyebrow">Inspiration Lab</p>
          <h2>AI导购产品回声</h2>
        </div>
        <p class="section-note">从资讯到产品假设。</p>
        <div class="research-controls"><button id="legacyToggle">查看旧版灵感存档</button><button id="exportNotes">导出我的笔记与收藏</button></div>
        <div class="word-cloud" id="wordCloud"></div>

        <div id="userInsightGrid" class="insight-grid user-grid"></div>
        <div id="insightGrid" class="insight-grid"></div>
      </section>
    </section>

  </main>

  <button id="floatingNoteBtn" class="floating-note-btn" aria-label="记笔记">＋<span>记笔记</span></button>
  <div id="noteOverlay" class="note-overlay" aria-hidden="true"></div>
  <section id="notePanel" class="note-lab floating-note-panel" aria-label="记笔记面板" aria-hidden="true">
    <button id="noteCloseBtn" class="note-close" aria-label="关闭记笔记">×</button>
    <div>
      <p class="eyebrow">Note</p>
      <h3>记笔记</h3>
      <p>写下想法，关联资料，留在回声里。笔记保存在当前浏览器。</p>
    </div>
    <div class="note-form">
      <textarea id="noteInput" placeholder="例如：AI导购能不能先从低风险复购场景建立信任，再迁移到高客单品类？"></textarea>
      <button id="notePreviewBtn">智能搜索支撑</button>
      <button id="noteSaveBtn" class="primary">加入回声</button>
    </div>
    <div id="notePreview" class="note-preview"></div>
  </section>

  <footer>每天 11:00 自动更新 · 北京时间，执行可能延迟</footer>
  <script src="./app.js?v=2026-10-08-tech-timeline-v2"></script>
</body>
</html>
